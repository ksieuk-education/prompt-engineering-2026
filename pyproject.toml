[project]
name = "agent-theatre"
version = "0.1.0"
description = "Агентский театр: четыре актёра и один общий выбор"
requires-python = ">=3.11,<4.0"
readme = "README.md"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.scripts]
theatre = "agent_theatre.cli:main"
theatre-audio = "agent_theatre.audio:main"

[tool.poetry]
packages = [{ include = "agent_theatre", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ipykernel = ">=6.29,<8"
nbclient = ">=0.10,<0.11"
nbformat = ">=5.10,<6"

[tool.poetry.group.audio]
optional = true

[tool.poetry.group.audio.dependencies]
torch = { version = ">=2.7,<2.10", python = "<3.15" }
numpy = { version = ">=1.26,<3", python = "<3.15" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
